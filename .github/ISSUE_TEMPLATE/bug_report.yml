name: Bug report
description: Report a reproducible gateway problem
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model alias
      placeholder: "gemini / fast"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove API keys and secrets.
      render: shell
